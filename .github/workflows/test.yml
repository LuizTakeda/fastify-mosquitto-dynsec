name: CI Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22, 24, 26]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Start Mosquitto Broker
        run: |
          docker compose up -d
          until docker compose exec -T mosquitto mosquitto_ctrl dynsec listRoles admin admin123456789 > /dev/null 2>&1; do
            echo "Waiting for Mosquitto DynSec broker to be ready..."
            sleep 1
          done
          echo "Mosquitto DynSec broker is ready!"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Run tests
        run: pnpm test

      - name: Stop Mosquitto Broker
        if: always()
        run: docker compose down
